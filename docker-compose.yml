services:
  mysql:
    image: mysql:8.4
    container_name: mesos-mysql
    environment:
      MYSQL_DATABASE: ${MESOS_MYSQL_DB:-mesos}
      MYSQL_ROOT_PASSWORD: ${MESOS_MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MESOS_MYSQL_PORT:-3306}:3306"
    command: --default-time-zone=+00:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
