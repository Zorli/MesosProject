services:
  postgres:
    image: postgres:16-alpine
    container_name: mesos-postgres
    environment:
      POSTGRES_DB: ${MESOS_POSTGRES_DB:-mesos}
      POSTGRES_USER: ${MESOS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MESOS_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${MESOS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MESOS_POSTGRES_USER:-postgres} -d ${MESOS_POSTGRES_DB:-mesos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
