<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesos card mapping review</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --text: #1e1b16;
      --muted: #6f675c;
      --line: #d8d0c3;
      --accent: #8f4d24;
      --accent-2: #214f4b;
      --danger: #a93024;
      --ok: #2f6b3f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 20px;
      background: rgba(244, 241, 234, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .pill.ok {
      color: var(--ok);
      border-color: color-mix(in srgb, var(--ok) 35%, var(--line));
    }

    .pill.bad {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
    }

    main {
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      min-height: calc(100vh - 57px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: #ece6da;
      min-height: 100%;
    }

    .filters {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    input,
    select,
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 6px 9px;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
    }

    button:hover,
    .card-row:hover {
      border-color: var(--accent);
    }

    .file-fallback {
      display: none;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff7e6;
      color: var(--muted);
      font-size: 13px;
    }

    .file-fallback.visible {
      display: grid;
    }

    .list {
      display: grid;
      gap: 6px;
      padding: 10px;
      max-height: calc(100vh - 183px);
      overflow: auto;
    }

    .card-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 8px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
    }

    .card-row.active {
      border-color: var(--accent);
      background: var(--panel);
    }

    .card-row strong {
      font-size: 15px;
    }

    .card-row span {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thumb {
      width: 44px;
      aspect-ratio: 2.5 / 3.5;
      object-fit: cover;
      border-radius: 4px;
      background: #d8d0c3;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      padding: 24px;
    }

    .image-panel,
    .data-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .image-panel {
      position: sticky;
      top: 82px;
      padding: 16px;
    }

    .image-panel img {
      display: block;
      width: 100%;
      max-height: calc(100vh - 160px);
      object-fit: contain;
      border-radius: 7px;
      background: #d8d0c3;
    }

    .missing-image {
      display: grid;
      place-items: center;
      min-height: 360px;
      border: 1px dashed var(--danger);
      border-radius: 7px;
      color: var(--danger);
      text-align: center;
    }

    .data-panel {
      overflow: hidden;
    }

    .data-header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .data-header h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    dl {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 10px 18px;
      margin: 0;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    dt {
      color: var(--muted);
      font-size: 13px;
    }

    dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    section {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    section:last-child {
      border-bottom: 0;
    }

    h3 {
      margin: 0 0 10px;
      color: var(--accent-2);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    pre {
      margin: 0;
      max-height: 420px;
      overflow: auto;
      padding: 12px;
      border-radius: 6px;
      background: #25211c;
      color: #fff8ea;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      header,
      main,
      .workspace {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .list {
        max-height: 260px;
      }

      .image-panel {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mesos card mapping review</h1>
    <div class="status" id="status"></div>
  </header>

  <main>
    <aside>
      <div class="file-fallback" id="fileFallback">
        <div>Fetch del JSON non riuscito. Apri la pagina via server locale oppure carica il file.</div>
        <input type="file" id="jsonFile" accept="application/json,.json">
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Cerca id, tipo, era, attributi">
        <select id="sectionFilter">
          <option value="">Tutte le sezioni</option>
        </select>
        <select id="groupFilter">
          <option value="">Tutti i gruppi</option>
        </select>
      </div>
      <div class="list" id="cardList"></div>
    </aside>

    <div class="workspace" id="workspace">
      <div class="empty">Caricamento deckSetup.json...</div>
    </div>
  </main>

  <script>
    const JSON_PATH = "../src/main/resources/it/polimi/ingsoft/mesos/server/model/Factory/deckSetup.json";
    const IMAGE_PATH_PREFIX = "../src/main/resources/it/polimi/ingsoft/mesos/client/assets/cards/";

    const state = {
      cards: [],
      filtered: [],
      selectedId: null,
      imageIds: new Set()
    };

    const statusEl = document.getElementById("status");
    const cardListEl = document.getElementById("cardList");
    const workspaceEl = document.getElementById("workspace");
    const searchEl = document.getElementById("search");
    const sectionFilterEl = document.getElementById("sectionFilter");
    const groupFilterEl = document.getElementById("groupFilter");
    const fileFallbackEl = document.getElementById("fileFallback");
    const jsonFileEl = document.getElementById("jsonFile");

    function flattenCards(deck) {
      const cards = [];
      for (const [section, groups] of Object.entries(deck.cards || {})) {
        for (const [group, records] of Object.entries(groups || {})) {
          for (const record of records || []) {
            cards.push({
              ...record,
              section,
              group,
              imagePath: `${IMAGE_PATH_PREFIX}${record.id}.jpg`
            });
          }
        }
      }
      return cards.sort((a, b) => a.id - b.id);
    }

    function checkImage(id) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve(id);
        image.onerror = () => resolve(null);
        image.src = `${IMAGE_PATH_PREFIX}${id}.jpg`;
      });
    }

    async function loadImageIds(cards, excludedAssetIds) {
      const maxId = Math.max(
        ...cards.map((card) => card.id),
        ...excludedAssetIds
      );
      const results = await Promise.all(
        Array.from({ length: maxId }, (_, index) => checkImage(index + 1))
      );
      state.imageIds = new Set(results.filter(Boolean));
    }

    function renderOptions() {
      const sections = [...new Set(state.cards.map((card) => card.section))];
      const groups = [...new Set(state.cards.map((card) => card.group))];
      sectionFilterEl.innerHTML = `<option value="">Tutte le sezioni</option>` +
        sections.map((section) => `<option value="${escapeHtml(section)}">${escapeHtml(section)}</option>`).join("");
      groupFilterEl.innerHTML = `<option value="">Tutti i gruppi</option>` +
        groups.map((group) => `<option value="${escapeHtml(group)}">${escapeHtml(group)}</option>`).join("");
    }

    function applyFilters() {
      const query = searchEl.value.trim().toLowerCase();
      const section = sectionFilterEl.value;
      const group = groupFilterEl.value;
      state.filtered = state.cards.filter((card) => {
        const haystack = JSON.stringify(card).toLowerCase();
        return (!section || card.section === section) &&
          (!group || card.group === group) &&
          (!query || haystack.includes(query));
      });
      if (!state.filtered.some((card) => card.id === state.selectedId)) {
        state.selectedId = state.filtered[0]?.id ?? null;
      }
      renderList();
      renderSelected();
    }

    function renderStatus(source) {
      const ids = state.cards.map((card) => card.id);
      const maxId = Math.max(...ids);
      const missingIds = Array.from({ length: maxId }, (_, index) => index + 1)
        .filter((id) => !ids.includes(id));
      const jsonWithoutImage = ids.filter((id) => !state.imageIds.has(id));
      const imageWithoutJson = [...state.imageIds].filter((id) => !ids.includes(id));

      statusEl.innerHTML = [
        pill(`${state.cards.length} carte JSON`, true),
        pill(`id ${Math.min(...ids)}..${maxId}`, missingIds.length === 0),
        pill(`buchi id: ${missingIds.length ? missingIds.join(", ") : "nessuno"}`, missingIds.length === 0),
        pill(`JSON senza immagine: ${jsonWithoutImage.length ? jsonWithoutImage.join(", ") : "nessuna"}`, jsonWithoutImage.length === 0),
        pill(`immagini extra: ${imageWithoutJson.length ? imageWithoutJson.join(", ") : "nessuna"}`, true),
        pill(source, true)
      ].join("");
    }

    function pill(text, ok) {
      return `<span class="pill ${ok ? "ok" : "bad"}">${escapeHtml(text)}</span>`;
    }

    function renderList() {
      if (state.filtered.length === 0) {
        cardListEl.innerHTML = `<div class="empty">Nessuna carta trovata.</div>`;
        return;
      }

      cardListEl.innerHTML = state.filtered.map((card) => `
        <button class="card-row ${card.id === state.selectedId ? "active" : ""}" data-id="${card.id}">
          <img class="thumb" src="${card.imagePath}" alt="Carta ${card.id}" loading="lazy">
          <span>
            <strong>#${card.id}</strong>
            <span>${escapeHtml(card.section)} / ${escapeHtml(card.group)} / ${escapeHtml(card.era)}</span>
          </span>
        </button>
      `).join("");

      for (const button of cardListEl.querySelectorAll(".card-row")) {
        button.addEventListener("click", () => selectCard(Number(button.dataset.id)));
      }
    }

    function selectCard(id) {
      state.selectedId = id;
      renderList();
      renderSelected();
    }

    function moveSelection(delta) {
      const index = state.filtered.findIndex((card) => card.id === state.selectedId);
      const next = state.filtered[index + delta];
      if (next) {
        selectCard(next.id);
      }
    }

    function renderSelected() {
      const card = state.cards.find((item) => item.id === state.selectedId);
      if (!card) {
        workspaceEl.innerHTML = `<div class="empty">Seleziona una carta.</div>`;
        return;
      }

      const hasImage = state.imageIds.has(card.id);
      workspaceEl.innerHTML = `
        <div class="image-panel">
          ${hasImage
            ? `<img src="${card.imagePath}" alt="Carta ${card.id}">`
            : `<div class="missing-image">Immagine mancante<br>${escapeHtml(card.imagePath)}</div>`}
        </div>
        <article class="data-panel">
          <div class="data-header">
            <h2>Carta #${card.id}</h2>
            <div class="nav">
              <button id="prevCard" type="button">Precedente</button>
              <button id="nextCard" type="button">Successiva</button>
            </div>
          </div>
          <dl>
            <dt>section</dt><dd>${escapeHtml(card.section)}</dd>
            <dt>group</dt><dd>${escapeHtml(card.group)}</dd>
            <dt>era</dt><dd>${escapeHtml(card.era)}</dd>
            <dt>minPlayers</dt><dd>${card.minPlayers ?? "sempre inclusa"}</dd>
            <dt>image</dt><dd>${escapeHtml(`${card.id}.jpg`)}</dd>
          </dl>
          <section>
            <h3>model</h3>
            <pre>${escapeHtml(JSON.stringify(card.model ?? {}, null, 2))}</pre>
          </section>
          <section>
            <h3>presentation</h3>
            <pre>${escapeHtml(JSON.stringify(card.presentation ?? {}, null, 2))}</pre>
          </section>
          <section>
            <h3>record completo</h3>
            <pre>${escapeHtml(JSON.stringify(stripRuntimeFields(card), null, 2))}</pre>
          </section>
        </article>
      `;

      document.getElementById("prevCard").addEventListener("click", () => moveSelection(-1));
      document.getElementById("nextCard").addEventListener("click", () => moveSelection(1));
    }

    function stripRuntimeFields(card) {
      const { imagePath, ...record } = card;
      return record;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function initialize(deck, source) {
      state.cards = flattenCards(deck);
      state.selectedId = state.cards[0]?.id ?? null;
      await loadImageIds(state.cards, deck.source?.excludedAssetIds ?? []);
      renderOptions();
      renderStatus(source);
      applyFilters();
    }

    async function loadFromFetch() {
      const response = await fetch(JSON_PATH);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    async function start() {
      try {
        const deck = await loadFromFetch();
        await initialize(deck, "JSON via fetch");
      } catch (error) {
        fileFallbackEl.classList.add("visible");
        workspaceEl.innerHTML = `
          <div class="empty">
            Se stai aprendo il file direttamente, il browser puo' bloccare il fetch locale.
            Avvia un server dalla root del repo e apri /docs/card-mapping-review.html.
          </div>
        `;
      }
    }

    jsonFileEl.addEventListener("change", async () => {
      const file = jsonFileEl.files[0];
      if (!file) {
        return;
      }
      const deck = JSON.parse(await file.text());
      await initialize(deck, `JSON caricato: ${file.name}`);
    });

    searchEl.addEventListener("input", applyFilters);
    sectionFilterEl.addEventListener("change", applyFilters);
    groupFilterEl.addEventListener("change", applyFilters);
    window.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement) {
        return;
      }
      if (event.key === "ArrowLeft") {
        moveSelection(-1);
      }
      if (event.key === "ArrowRight") {
        moveSelection(1);
      }
    });

    start();
  </script>
</body>
</html>
